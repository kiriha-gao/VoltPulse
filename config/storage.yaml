# Battery Energy Storage System (BESS) Default Specifications

storage:
  power_mw: 100.0
  energy_mwh: 200.0
  duration_hours: 2.0
  
  # State of Charge (SOC) bounds & initial condition
  soc_initial: 0.50
  soc_final: 0.50
  soc_min: 0.10
  soc_max: 0.90
  
  # Efficiency (round-trip efficiency ~85%, eta_c = eta_d = 0.922)
  charge_efficiency: 0.922
  discharge_efficiency: 0.922
  
  # Battery cell life degradation parameters
  degradation_cost_rmb_per_mwh: 30.0

# Benchmark strategies configuration
benchmark:
  fixed_strategy:
    # Default fixed windows (Shandong duck curve: typical PV midday peak charging + evening peak discharge)
    charging_windows:
      - start: "11:00"
        end: "15:00"
    discharging_windows:
      - start: "18:00"
        end: "22:00"
    markets:
      shandong:
        charging_windows:
          - start: "11:00"
            end: "15:00"
        discharging_windows:
          - start: "18:00"
            end: "22:00"
      jiangsu:
        # Dual-peak two-cycles windows: overnight valley + midday dip -> morning peak + evening peak
        charging_windows:
          - start: "01:00"
            end: "05:00"
          - start: "12:30"
            end: "15:00"
        discharging_windows:
          - start: "09:00"
            end: "11:30"
          - start: "18:30"
            end: "21:30"
