name: VoltPulse Automated Matrix Tests & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-matrix:
    name: Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: 4. Run Pytest Test Suite
        run: |
          python -m pytest -v

      - name: 5. Run Appendix C Probe Suite
        run: |
          python scripts/run_probes.py

      - name: 6. Run Secondary Review Edge-Case Probe Suite
        run: |
          python scripts/run_extra_probes.py

      - name: 7. Run Automated Acceptance Audit
        run: |
          python scripts/acceptance.py

      - name: 8. Verify Synthetic Research Report Builds
        run: |
          python scripts/build_research_report.py --market shandong
