name: VoltPulse Scheduled Daily Dispatch & Report

on:
  schedule:
    # Runs at 21:00 UTC daily (05:00 Asia/Shanghai next day)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-dispatch"
  cancel-in-progress: false

jobs:
  daily-dispatch:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: 4. Run VoltPulse Daily Pipeline
        run: |
          python scripts/pipeline.py --mode fixture --market shandong --backfill-days 14

      - name: 5. Run Verification Tests
        run: |
          pytest -v

      - name: 6. Build Public Dashboard & Daily Analytical Report
        run: |
          python scripts/build_dashboard.py --market shandong
          python scripts/build_research_report.py --market shandong

      - name: 7. Commit & Push Artifact Updates
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ public/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(daily): auto-update dispatch reports & dashboard [skip ci]" && git push)

      - name: 8. Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: 9. Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: 10. Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
